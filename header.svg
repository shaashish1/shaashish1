<svg viewBox="0 0 800 80" width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="80" fill="#0d1117"/>

  <!-- Blinking cursor using SMIL -->
  <rect id="cursor" x="14" y="20" width="3" height="38" rx="1" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Text with reveal animation using clip-path -->
  <clipPath id="clip">
    <rect x="0" y="0" height="80">
      <animate attributeName="width" from="0" to="800" dur="2.5s" fill="freeze"/>
    </rect>
  </clipPath>

  <text
    x="400" y="50"
    font-family="'Courier New', Courier, monospace"
    font-size="30"
    font-weight="bold"
    fill="#00D4FF"
    text-anchor="middle"
    dominant-baseline="middle"
    clip-path="url(#clip)"
  >Hi, I am Ashish Sharma 👋</text>

  <!-- Move cursor to follow text end -->
  <rect x="0" y="20" width="3" height="38" rx="1" fill="#00D4FF">
    <animate attributeName="x" from="14" to="790" dur="2.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" begin="2.5s"/>
  </rect>
</svg>
