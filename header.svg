<svg width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text {
        font-family: 'Fira Code', monospace;
        font-size: 32px;
        font-weight: 700;
        fill: #00D4FF;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .cursor {
        fill: #00D4FF;
        animation: blink 0.8s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .line1 { animation: typing 2.5s steps(24, end) forwards; overflow: hidden; white-space: nowrap; }
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
  </defs>
  <rect width="800" height="80" fill="#0d1117" rx="8"/>
  <text class="text" x="400" y="40">
    <tspan id="t">Hi, I am Ashish Sharma 👋</tspan>
  </text>
  <rect class="cursor" x="650" y="20" width="3" height="36" rx="1"/>
  <animate
    attributeName="opacity"
    values="0;0;1;1"
    keyTimes="0;0.1;0.2;1"
    dur="3s"
    fill="freeze"
  />
</svg>
