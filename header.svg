<svg viewBox="0 0 800 80" width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="80" fill="#0d1117" rx="6"/>

  <!-- Clip path for typewriter reveal -->
  <clipPath id="clip">
    <rect x="0" y="0" height="80" width="0">
      <animate attributeName="width" from="0" to="800" dur="2.8s" fill="freeze" begin="0s"/>
    </rect>
  </clipPath>

  <!-- Visible text always, clipped to reveal left to right -->
  <text
    x="50%" y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="28"
    font-weight="bold"
    fill="#00D4FF"
    clip-path="url(#clip)"
  >Hi, I am Ashish Sharma &#x1F44B;</text>

  <!-- Blinking cursor bar -->
  <rect fill="#00D4FF" x="790" y="22" width="3" height="36" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
